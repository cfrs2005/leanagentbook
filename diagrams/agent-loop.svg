<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" role="img" aria-labelledby="title desc"><title id="title">Agent Loop：请求不是执行事实</title><desc id="desc">任务进入脚本模型，模型请求经权限、参数和预算检查后执行工具；观察回填模型。final 结束协议，不保证业务成功。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4a6676"/></marker></defs>
<rect width="1000" height="560" rx="20" fill="#f7f5ef"/>
<text x="42" y="52" font-family="sans-serif" font-size="27" fill="#153c4b">Agent Loop：请求不是执行事实</text>
<path d="M 190 175 L 240 175" fill="none" stroke="#4a6676" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M 430 175 L 490 175" fill="none" stroke="#4a6676" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M 710 175 L 770 175" fill="none" stroke="#4a6676" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M 865 220 L 865 375 L 710 375" fill="none" stroke="#4a6676" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M 600 420 L 600 465 L 210 465 L 210 250 L 335 250 L 335 220" fill="none" stroke="#4a6676" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M 335 220 L 335 330" fill="none" stroke="#4a6676" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="40" y="130" width="150" height="90" rx="12" fill="#ffffff" stroke="#64818a"/>
<text x="115.0" y="165" text-anchor="middle" font-family="sans-serif" font-size="21" fill="#153c4b">任务</text>
<text x="115.0" y="195" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#31535f">输入与目标</text>
<rect x="240" y="130" width="190" height="90" rx="12" fill="#dcece7" stroke="#64818a"/>
<text x="335.0" y="165" text-anchor="middle" font-family="sans-serif" font-size="21" fill="#153c4b">模型适配器</text>
<text x="335.0" y="195" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#31535f">本例是脚本模拟器</text>
<rect x="490" y="130" width="220" height="90" rx="12" fill="#f4e4cd" stroke="#64818a"/>
<text x="600.0" y="165" text-anchor="middle" font-family="sans-serif" font-size="21" fill="#153c4b">宿主检查</text>
<text x="600.0" y="195" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#31535f">权限 · 参数 · 重复</text>
<rect x="770" y="130" width="190" height="90" rx="12" fill="#dcece7" stroke="#64818a"/>
<text x="865.0" y="165" text-anchor="middle" font-family="sans-serif" font-size="21" fill="#153c4b">工具执行</text>
<text x="865.0" y="195" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#31535f">查询 / 计算</text>
<rect x="490" y="330" width="220" height="90" rx="12" fill="#ffffff" stroke="#64818a"/>
<text x="600.0" y="365" text-anchor="middle" font-family="sans-serif" font-size="21" fill="#153c4b">Observation</text>
<text x="600.0" y="395" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#31535f">成功值或错误</text>
<rect x="240" y="330" width="190" height="90" rx="12" fill="#f4e4cd" stroke="#64818a"/>
<text x="335.0" y="365" text-anchor="middle" font-family="sans-serif" font-size="21" fill="#153c4b">终止条件</text>
<text x="335.0" y="395" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#31535f">final / 预算 / 超时</text>
<text x="42" y="521" font-family="sans-serif" font-size="17" fill="#31535f">观察回填驱动下一轮；所有工具动作仍由宿主校验。图与数据均为教学示意。</text></svg>
