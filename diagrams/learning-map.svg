<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc" lang="zh-CN">
  <title id="title">Lean Agent Book 六大部分 24 章学习地图</title>
  <desc id="desc">课程地图，六部分共24章：Part I AI 与 Agent 基础架构，第01至04章；Part II 模型工程与推理系统，第05至08章；Part III RAG 与 AI 数据工程，第09至12章；Part IV Agent 工程化与治理，第13至17章；Part V 分布式 AI 与机器人智能，第18至22章；Part VI 综合架构设计与工程实践，第23至24章。按编号从左到右、从上到下阅读，标题使用缩写，不表示已完成章节或学习依赖。</desc>
