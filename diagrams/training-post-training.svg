<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 620" role="img" aria-labelledby="title desc">
<title id="title">训练与后训练：数据边界和真实 LoRA 实验</title>
<desc id="desc">数据按场景独立划分。训练集更新适配器，验证集选择轮次，测试集仅最终评测。冻结底座与适配器重载后验证一致性。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#66777c"/></marker></defs>
<rect width="1120" height="620" fill="#f7f3eb"/>
<g font-family="PingFang SC, Noto Sans CJK SC, sans-serif" fill="#243b41">
<text x="48" y="52" font-size="28" font-weight="700">模型训练与后训练</text>
<text x="48" y="83" font-size="17">先定义可测的行为，再决定是否改变权重。</text>
<rect x="48" y="116" width="290" height="122" rx="12" fill="#ffffff" stroke="#b6c4c5"/>
<text x="66" y="146" font-size="19" font-weight="600">训练集 · 36 条</text>
<text x="66" y="174" font-size="16">仅用于梯度更新</text>
<text x="66" y="198" font-size="16">场景不跨集，输入不重复</text>
<rect x="412" y="116" width="290" height="122" rx="12" fill="#ffffff" stroke="#b6c4c5"/>
<text x="430" y="146" font-size="19" font-weight="600">验证集 · 12 条</text>
<text x="430" y="174" font-size="16">每轮计算 token loss</text>
<text x="430" y="198" font-size="16">仅据此选择 checkpoint</text>
<rect x="776" y="116" width="296" height="122" rx="12" fill="#ffffff" stroke="#b6c4c5"/>
<text x="794" y="146" font-size="19" font-weight="600">测试集 · 12 条</text>
<text x="794" y="174" font-size="16">选定后评测一次</text>
<text x="794" y="198" font-size="16">保留全部预测与错误</text>
<rect x="48" y="296" width="290" height="136" rx="12" fill="#e6eeeb" stroke="#b6c4c5"/>
<text x="66" y="326" font-size="19" font-weight="600">冻结 FLAN-T5-small</text>
<text x="66" y="354" font-size="16">FP32 CPU · 固定 revision</text>
<text x="66" y="378" font-size="16">训练 LoRA：q / v，rank 8</text>
<text x="66" y="402" font-size="16">真实反向传播与参数更新</text>
<rect x="412" y="296" width="290" height="136" rx="12" fill="#e6eeeb" stroke="#b6c4c5"/>
<text x="430" y="326" font-size="19" font-weight="600">8 轮 SFT → 选定适配器</text>
<text x="430" y="354" font-size="16">交叉熵 + AdamW</text>
<text x="430" y="378" font-size="16">loss 曲线、配置与种子</text>
<text x="430" y="402" font-size="16">权重留本机，不入仓库</text>
<rect x="776" y="296" width="296" height="136" rx="12" fill="#e6eeeb" stroke="#b6c4c5"/>
<text x="794" y="326" font-size="19" font-weight="600">对比基线 / 训练后</text>
<text x="794" y="354" font-size="16">同提示词、同解码配置</text>
<text x="794" y="378" font-size="16">accuracy / macro-F1</text>
<text x="794" y="402" font-size="16">重新加载后核对 logits</text>
<path d="M193,238 L193,296" stroke="#66777c" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M557,238 L557,296" stroke="#66777c" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M924,238 L924,296" stroke="#66777c" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M338,364 L412,364" stroke="#66777c" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M702,364 L776,364" stroke="#66777c" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="48" y="488" width="1024" height="88" rx="12" fill="#f1e5d7" stroke="#b6c4c5"/>
<text x="66" y="518" font-size="19" font-weight="600">边界</text>
<text x="66" y="546" font-size="16">本实验只执行 SFT + LoRA；QLoRA、PPO、DPO、GRPO 与蒸馏用于路线比较，不宣称已实跑。</text>
</g></svg>