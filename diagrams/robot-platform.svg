<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc"><title id="title">机器人诊断端到端教学原型</title><desc id="desc">合成数据经现场缓存和HTTP进入持久化队列，再生成证据与草稿，人工批准只创建检查记录。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#396658" stroke-width="1.6"/></marker></defs><rect width="1200" height="680" fill="#f8f5ee"/><g font-family="Arial, PingFang SC, sans-serif" fill="#233c34"><text x="48" y="58" font-size="30" font-weight="700">从设备事件，到可复核的检查记录</text><text x="48" y="93" font-size="17">真实 HTTP 与事务 · 合成数据 · 本机部署 · 不发送控制指令</text><rect x="48" y="142" width="304" height="166" rx="16" fill="#fffdf8" stroke="#aac4b8" stroke-width="2"/><circle cx="74" cy="172" r="8" fill="#c97850"/><text x="95" y="179" font-size="21" font-weight="700">01 · 现场缓存</text><text x="70" y="218" font-size="17">CSV + 版本 + 事件 ID</text><text x="70" y="247" font-size="17">SQLite outbox 持久化</text><text x="70" y="276" font-size="17">断网保留；恢复重传</text><rect x="448" y="142" width="304" height="166" rx="16" fill="#fffdf8" stroke="#aac4b8" stroke-width="2"/><circle cx="474" cy="172" r="8" fill="#c97850"/><text x="495" y="179" font-size="21" font-weight="700">02 · 上传与队列</text><text x="470" y="218" font-size="17">身份绑定设备与租户</text><text x="470" y="247" font-size="17">相同 ID / hash 去重</text><text x="470" y="276" font-size="17">不同内容拒绝覆盖</text><rect x="848" y="142" width="304" height="166" rx="16" fill="#fffdf8" stroke="#aac4b8" stroke-width="2"/><circle cx="874" cy="172" r="8" fill="#c97850"/><text x="895" y="179" font-size="21" font-weight="700">03 · 证据诊断</text><text x="870" y="218" font-size="17">窗口 + 缺失检查</text><text x="870" y="247" font-size="17">固定说明检索 + 来源</text><text x="870" y="276" font-size="17">图示附件，不是视觉识别</text><rect x="848" y="370" width="304" height="166" rx="16" fill="#fffdf8" stroke="#aac4b8" stroke-width="2"/><circle cx="874" cy="400" r="8" fill="#c97850"/><text x="895" y="407" font-size="21" font-weight="700">04 · 语言草稿</text><text x="870" y="446" font-size="17">模板或真实 FLAN-T5</text><text x="870" y="475" font-size="17">草稿不能改证据与状态</text><text x="870" y="504" font-size="17">模型出错 → 固定模板</text><rect x="448" y="370" width="304" height="166" rx="16" fill="#fffdf8" stroke="#aac4b8" stroke-width="2"/><circle cx="474" cy="400" r="8" fill="#c97850"/><text x="495" y="407" font-size="21" font-weight="700">05 · 只读报告</text><text x="470" y="446" font-size="17">观测、引用、版本、耗时</text><text x="470" y="475" font-size="17">报告与审计一起提交</text><text x="470" y="504" font-size="17">崩溃后可恢复处理</text><rect x="48" y="370" width="304" height="166" rx="16" fill="#fffdf8" stroke="#aac4b8" stroke-width="2"/><circle cx="74" cy="400" r="8" fill="#c97850"/><text x="95" y="407" font-size="21" font-weight="700">06 · 检查审批</text><text x="70" y="446" font-size="17">角色 + 租户 + 报告 hash</text><text x="70" y="475" font-size="17">批准只创建检查记录</text><text x="70" y="504" font-size="17">重复提交不新增</text><path d="M352 222H436" fill="none" stroke="#396658" stroke-width="3" marker-end="url(#arrow)"/><path d="M752 222H836" fill="none" stroke="#396658" stroke-width="3" marker-end="url(#arrow)"/><path d="M1000 308V358" fill="none" stroke="#396658" stroke-width="3" marker-end="url(#arrow)"/><path d="M848 454H764" fill="none" stroke="#396658" stroke-width="3" marker-end="url(#arrow)"/><path d="M448 454H364" fill="none" stroke="#396658" stroke-width="3" marker-end="url(#arrow)"/><rect x="48" y="578" width="1104" height="61" rx="12" fill="#e7eee8"/><text x="70" y="615" font-size="18">边界：规则异常 ≠ 已确认根因；模型调用成功 ≠ 建议可信；演示审批 ≠ 人员实际复核</text></g></svg>
