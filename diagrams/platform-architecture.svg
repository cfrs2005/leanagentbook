<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="730" viewBox="0 0 1200 730" role="img" aria-labelledby="title desc"><title id="title">企业 Agent 平台职责图</title><desc id="desc">用户经过身份入口调用运行层，运行层使用模型、知识与工具网关。管理面发布版本；业务服务仍检查最终资源权限。设计示意，未部署。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6" fill="#316653"/></marker></defs><rect width="1200" height="730" rx="18" fill="#F6F1E7"/><g font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" fill="#22312F"><text x="45" y="58" font-size="30" font-weight="700">共用能力，不共用业务权限</text><text x="45" y="91" font-size="17">数据流、身份流、管理面与责任边界 · 架构设计示意，未部署</text><rect x="45" y="130" width="250" height="110" rx="12" fill="#FFFCF6" stroke="#D9D2C4"/><text x="65" y="165" font-size="21" font-weight="600">用户与应用</text><text x="65" y="195" font-size="16">采购 / 维修</text><text x="65" y="218" font-size="16">提出目标，不能自授权限</text><rect x="365" y="130" width="450" height="110" rx="12" fill="#FFFCF6" stroke="#D9D2C4"/><text x="385" y="165" font-size="21" font-weight="600">入口与 Runtime</text><text x="385" y="195" font-size="16">身份验证 → 限流 → 持久任务 → 运行</text><text x="385" y="218" font-size="16">主体、租户、项目及版本绑定</text><rect x="885" y="130" width="270" height="110" rx="12" fill="#E6EEE6" stroke="#D9D2C4"/><text x="905" y="165" font-size="21" font-weight="600">管理面</text><text x="905" y="195" font-size="16">策略、模型、工具与预算</text><text x="905" y="218" font-size="16">发布不可变版本</text><path d="M295,185 L365,185" fill="none" stroke="#316653" stroke-width="2" marker-end="url(#arrow)"/><path d="M885,185 L815,185" fill="none" stroke="#316653" stroke-width="2" marker-end="url(#arrow)"/><rect x="45" y="330" width="310" height="110" rx="12" fill="#FFFCF6" stroke="#D9D2C4"/><text x="65" y="365" font-size="21" font-weight="600">Model Gateway</text><text x="65" y="395" font-size="16">模型路由与费用</text><text x="65" y="418" font-size="16">服务端保管密钥引用</text><rect x="445" y="330" width="310" height="110" rx="12" fill="#FFFCF6" stroke="#D9D2C4"/><text x="465" y="365" font-size="21" font-weight="600">Knowledge / Memory</text><text x="465" y="395" font-size="16">按身份检索与召回</text><text x="465" y="418" font-size="16">来源、版本、过期与删除</text><rect x="845" y="330" width="310" height="110" rx="12" fill="#FFFCF6" stroke="#D9D2C4"/><text x="865" y="365" font-size="21" font-weight="600">Tool Gateway</text><text x="865" y="395" font-size="16">参数、授权、审批、幂等</text><text x="865" y="418" font-size="16">每次敏感动作重新判断</text><path d="M590,240 V285 H200 V330" fill="none" stroke="#316653" stroke-width="2" marker-end="url(#arrow)"/><path d="M590,240 V285 H600 V330" fill="none" stroke="#316653" stroke-width="2" marker-end="url(#arrow)"/><path d="M590,240 V285 H1000 V330" fill="none" stroke="#316653" stroke-width="2" marker-end="url(#arrow)"/><rect x="45" y="530" width="710" height="110" rx="12" fill="#FFFCF6" stroke="#D9D2C4"/><text x="65" y="565" font-size="21" font-weight="600">观测与质量：使用脱敏证据</text><text x="65" y="595" font-size="16">Trace 串联任务与工具；评测判断结果是否满足业务标准</text><text x="65" y="618" font-size="16">服务维护者、数据负责人、业务审批人与审计人员各有职责</text><rect x="845" y="530" width="310" height="110" rx="12" fill="#FFFCF6" stroke="#D9D2C4"/><text x="865" y="565" font-size="21" font-weight="600">权威业务服务</text><text x="865" y="595" font-size="16">再次核对资源与动作权限</text><text x="865" y="618" font-size="16">保留业务结果和操作标识</text><path d="M1000,440 L1000,530" fill="none" stroke="#316653" stroke-width="2" marker-end="url(#arrow)"/><path d="M600,440 L600,530" fill="none" stroke="#316653" stroke-width="2" marker-end="url(#arrow)"/><path d="M200,440 L200,530" fill="none" stroke="#316653" stroke-width="2" marker-end="url(#arrow)"/><text x="45" y="690" font-size="17" fill="#B94F2D">登录成功 ≠ 任意资源授权；模型建议 ≠ 已获审批；工具超时 ≠ 写入没有发生。</text></g></svg>