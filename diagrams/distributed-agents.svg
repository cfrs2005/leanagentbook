<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
<title id="title">第18章：独立 Worker 与协调器</title>
<desc id="desc">租户请求经过入口校验进入协调器，调度器按租户轮转，三个独立 Worker 通过本机 HTTP 领取任务。租约过期后重新分配并增加代次，旧代次结果被拒绝。本图为单机多进程实验，不代表跨机高可用部署。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#316653"/></marker></defs>
<rect width="1200" height="680" fill="#F6F1E7"/>
<g font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" fill="#22312F">
<text x="40" y="57" font-size="34">18 / 分布式 Agent：分开执行，集中裁决</text>
<text x="40" y="92" font-size="18" fill="#596963">单机 · 多个独立进程 · loopback HTTP · 合成计算 · 内存状态</text>
<g fill="#FFFCF6" stroke="#D9D2C4" stroke-width="2">
<rect x="40" y="145" width="220" height="225" rx="12"/>
<rect x="315" y="125" width="510" height="350" rx="12"/>
<rect x="890" y="135" width="270" height="90" rx="12"/>
<rect x="890" y="260" width="270" height="90" rx="12"/>
<rect x="890" y="385" width="270" height="90" rx="12"/>
<rect x="40" y="520" width="1120" height="120" rx="12"/>
</g>
<text x="60" y="182" font-size="22">01 / 租户入口</text>
<text x="60" y="225" font-size="18">alpha / beta</text>
<text x="60" y="265" font-size="18">幂等键 + 参数校验</text>
<text x="60" y="305" font-size="18">每租户预算预留</text>
<text x="60" y="345" font-size="16" fill="#B94F2D">生产还需身份与权限</text>
<text x="340" y="164" font-size="22">02 / 协调器：唯一状态裁决点</text>
<text x="340" y="205" font-size="18">Registry：能力、进程号、最后联系时间</text>
<text x="340" y="245" font-size="18">Dispatcher：租户轮转 + 并发上限</text>
<text x="340" y="285" font-size="18">任务：queued → running → done</text>
<text x="340" y="325" font-size="18">租约：到期重排，generation + 1</text>
<text x="340" y="365" font-size="18">提交：匹配 owner + generation + deadline</text>
<text x="340" y="405" font-size="18">聚合：仅统计已接受的唯一任务结果</text>
<text x="340" y="445" font-size="16" fill="#B94F2D">本机互斥锁 ≠ 分布式锁 / 多副本共识</text>
<text x="910" y="171" font-size="22">03 / Worker A</text>
<text x="910" y="204" font-size="17">独立 PID · 领取 / 心跳 / 提交</text>
<text x="910" y="296" font-size="22">04 / Worker B</text>
<text x="910" y="329" font-size="17">独立 PID · 领取 / 心跳 / 提交</text>
<text x="910" y="421" font-size="22">05 / Worker C</text>
<text x="910" y="454" font-size="17">独立 PID · 领取 / 心跳 / 提交</text>
<g stroke="#316653" fill="none" stroke-width="2" marker-end="url(#arrow)">
<path d="M260 250 H315"/>
<path d="M890 180 H825"/>
<path d="M890 305 H825"/>
<path d="M890 430 H825"/>
</g>
<text x="60" y="560" font-size="22" fill="#B94F2D">故障接管：旧进程停止响应 → 租约到期 → 新进程取得新代次</text>
<text x="60" y="597" font-size="18">旧进程迟到提交 → 拒绝写入；同代次相同结果重投 → 返回成功，不重复计入聚合</text>
<text x="60" y="624" font-size="16" fill="#596963">实验验证消息边界与接管；不验证协调器崩溃恢复、跨机分区、真实模型费用或生产容量。</text>
</g></svg>
