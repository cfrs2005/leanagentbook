      - 19 · 时间序列与异常检测: chapters/19-time-series.md
      - 20 · ROS 数据与事件: chapters/20-robotics-ros.md
      - 21 · 边缘推理与安全升级: chapters/21-edge-cloud.md
      - 22 · 因果诊断与反事实: chapters/22-causal-diagnosis.md
  - 综合设计:
