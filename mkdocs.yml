site_name: AI Agent 工程图解
site_description: 从面试追问到可运行实验的中文 AI Agent 工程课程
site_url: https://cfrs2005.github.io/leanagentbook/
repo_url: https://github.com/cfrs2005/leanagentbook
repo_name: GitHub · 课程源码
docs_dir: build/docs
site_dir: build/site
strict: true
theme:
  name: material
  language: zh
  font: false
  logo: diagrams/icons/foundation.svg
  favicon: diagrams/icons/foundation.svg
  features:
    - navigation.footer
    - navigation.top
    - navigation.sections
    - search.suggest
    - search.highlight
    - content.code.copy
plugins:
  - search:
      lang:
        - en
        - ja
markdown_extensions:
  - admonition
  - tables
  - attr_list
  - pymdownx.highlight
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
extra_css:
  - stylesheets/book.css
nav:
  - 阅读首页: index.md
  - 开始学习:
      - 00 · 从面试追问开始: chapters/00-start-here.md
      - 01 · 模型基础: chapters/01-model-foundations.md
      - 02 · Agent 工作原理: chapters/02-agent-loop.md
      - 03 · Runtime 与 Harness: chapters/03-runtime-harness.md
      - 04 · 工作流与多 Agent: chapters/04-workflow-orchestration.md
  - 模型工程:
      - 05 · Transformer 内部原理: chapters/05-transformer-internals.md
      - 06 · 训练与后训练: chapters/06-training-post-training.md
      - 07 · 推理与服务: chapters/07-inference-serving.md
      - 08 · 路由与成本: chapters/08-model-routing.md
  - 检索与数据:
      - 09 · 向量检索与融合: chapters/09-vector-retrieval.md
      - 10 · RAG 全链路: chapters/10-rag-pipeline.md
      - 11 · 多模态检索: chapters/11-multimodal-rag.md
      - 12 · 数据流水线: chapters/12-data-engineering.md
  - 工程与治理:
      - 13 · 记忆与上下文: chapters/13-memory-context.md
      - 14 · 评测与质量: chapters/14-evaluation.md
      - 15 · 运行观测与回放: chapters/15-observability.md
      - 16 · 持久化与恢复: chapters/16-durable-execution.md
      - 17 · 权限与安全: chapters/17-security-governance.md
  - 分布式与机器人:
