name: Book checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Check course links and SVGs
        run: python scripts/check_book.py
      - name: Install PDF lab dependencies
        run: pip install -r labs/rag_pipeline/requirements-pdf.txt
      - name: Test all course labs
        run: python scripts/test_labs.py
      - name: Package course sources
        if: matrix.python-version == '3.11'
        run: git archive --format=zip --output=course-source.zip HEAD
      - uses: actions/upload-artifact@v4
        if: matrix.python-version == '3.11'
        with:
          name: lean-agent-book-source
          path: course-source.zip
