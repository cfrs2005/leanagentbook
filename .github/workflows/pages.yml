name: Publish book
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-book.txt
      - run: pip install -r requirements-book.txt
      - run: python scripts/check_book.py
      - run: python -m unittest discover -s labs/agent_loop -p 'test_*.py'
      - run: python -m unittest discover -s labs/robot_diagnosis -p 'test_*.py'
      - run: python scripts/prepare_site.py
      - run: mkdocs build --strict
      - uses: actions/upload-pages-artifact@v4
        with:
          path: build/site
  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
